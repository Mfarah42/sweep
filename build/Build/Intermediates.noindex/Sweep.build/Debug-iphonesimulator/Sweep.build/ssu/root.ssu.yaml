apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.mohamed.sweep
    intents:
    - metadata:
        name: ParkIntent_0
        title: I Just Parked
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }I just parked in ${+applicationName}'
          - '{${+prefix} }Tell ${+applicationName} I parked'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Sweep
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
