# Editorial side-name overrides for SF (spec §4.4.1). Keys are segment ids
# ({city}:{block_id}:{side_key}); entries win over the geometric fallback and
# ship with landmark_confidence "editorial".
#
# NOTE: the web prototype (sweep-app.jsx) was not available at build time, so
# these launch-neighborhood entries are authored fresh in the same style
# rather than ported verbatim — review copy before launch.
# Arterials the landmark pass may name neighboring sides after ("Valencia
# side · toward Valencia St"). SF's sweeping data has no road-class field, so
# this list is editorial. Names must match the dataset's corridor display
# names (zero-padding already stripped by the adapter).
