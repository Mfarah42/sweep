# XcodeGen manifest — `xcodegen generate` produces Sweep.xcodeproj.
# Single config (spec §2). Bundle ids follow the com.mohamed.* convention used by Prayer Windows and Mihrab.
name: Sweep
options:
  bundleIdPrefix: com.mohamed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SweepCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 52484H75XU
    CODE_SIGN_STYLE: Automatic

schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
      # Local StoreKit testing: sweep.plus purchasable in the simulator with
      # no App Store Connect setup. Delete this line to hit the sandbox.
      storeKitConfiguration: Sweep/Sweep.storekit
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  Sweep:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohamed.sweep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: Sweep/App
      - path: Sweep/Features
      - path: Sweep/DesignSystem
      - path: Sweep/Assets.xcassets
      - path: Sweep/Resources
        buildPhase: resources
    dependencies:
      - package: SweepCore
      - target: SweepWidgets
        embed: true
    entitlements:
      path: Sweep/Sweep.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mohamed.sweep
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Sweep/Info.plist
      properties:
        CFBundleDisplayName: Sweep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: >-
          Sweep uses your location once, when you park, to find your block.
          It never leaves your phone.
        NSRemindersFullAccessUsageDescription: >-
          Optional: Sweep can add your move-by deadline to the Reminders app.
          Sweep's own alerts work without this.
        NSLocationTemporaryUsageDescriptionDictionary:
          BlockFinding: >-
            Sweep needs your exact position for a moment to find which block
            you parked on. Approximate location can miss by several streets.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.mohamed.sweep.refresh
        UIBackgroundModes:
          - fetch
        UIAppFonts:
          - Fraunces-VariableFont.ttf
          - Fraunces-Italic-VariableFont.ttf
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sweep]
        ITSAppUsesNonExemptEncryption: false

  SweepWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohamed.sweep.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 2
    sources:
      - path: SweepWidgets
      - path: Sweep/App/SweepActivityAttributes.swift
      - path: Sweep/DesignSystem/Tokens.swift
      - path: Sweep/DesignSystem/Components.swift
      # Widgets read schedule bundles from the App Group (§9); only fonts +
      # privacy manifest ship inside the extension.
      - path: Sweep/Resources/Fraunces-VariableFont.ttf
        buildPhase: resources
      - path: Sweep/Resources/Fraunces-Italic-VariableFont.ttf
        buildPhase: resources
      - path: Sweep/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SweepCore
    entitlements:
      path: SweepWidgets/SweepWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mohamed.sweep
    info:
      path: SweepWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sweep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fraunces-VariableFont.ttf
          - Fraunces-Italic-VariableFont.ttf
